name: church_sanctuary
description: "Church Sanctuary - An offline-first church companion app with public-domain Scripture reader, devotions, sermon audio, prayer groups, and staff portal."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management (MVVM pattern)
  flutter_riverpod: ^2.5.1

  # Local Database (SQLite via Drift)
  drift: ^2.18.0
  drift_sqflite: ^2.0.1
  sqlite3_flutter_libs: ^0.5.24

  # Routing & Navigation
  go_router: ^14.1.4

  # Audio Player for Sermons & Devotional Narration
  just_audio: ^0.9.38
  audio_session: ^0.1.19

  # Local Notifications & Reminders
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2

  # Icons & UI Accents
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true

  assets:
    - assets/bible/
    - assets/audio/
